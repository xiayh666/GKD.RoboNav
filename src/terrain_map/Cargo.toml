[package]
name = "terrain-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "ROS-independent terrain mapping and analysis library"

[dependencies]
rayon = "1.12"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
